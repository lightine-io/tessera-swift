name: CI

# Builds, tests, and API-guards the TesseraUI SwiftUI product. String Catalogs and SwiftUI do not compile
# under `swift build`, so everything runs through xcodebuild against an iOS Simulator (ADR-026 §4/§5).
#
# The ADR-025 automated release PR (which bumps the Tessera XCFramework url/checksum) must require these
# jobs as status checks, so a UI-breaking XCFramework change fails the release instead of shipping a broken
# tag. Wiring the required checks is a one-time branch-protection setting on this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apiguard:
    runs-on: macos-15
    env:
      # The swift-api-digester baseline is Swift/Xcode-version sensitive. Pin the toolchain that generated
      # api/TesseraUI.baseline.json; bump this and regenerate the baseline together.
      XCODE_VERSION: "26.6"
      SIMULATOR: "iPhone 17"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest ${{ env.XCODE_VERSION }}.x on the runner)
        run: |
          # The runner's Xcode may be Xcode_26.6.app or Xcode_26.6.0.app etc.; pick the newest matching the
          # pinned major.minor rather than hard-coding a full path (which broke: no /Applications/Xcode_26.6.app).
          XC=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Ensure an iOS simulator runtime and device exist
        run: |
          # The runner image does not always ship a simulator runtime for the Xcode selected above
          # (seen with Xcode 26.3 on macos-15: only placeholder destinations). Download it if missing,
          # then use whatever iPhone is available instead of a hard-coded name.
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            sudo xcodebuild -downloadPlatform iOS
          fi
          DEV=$(xcrun simctl list devices available | grep -m1 -oE "iPhone[^(]*" | sed 's/ *$//')
          if [ -z "$DEV" ]; then
            RT=$(xcrun simctl list runtimes | grep -m1 -oE "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+")
            xcrun simctl create "CI iPhone" "${SIMULATOR}" "$RT"
            DEV="CI iPhone"
          fi
          echo "Using simulator: $DEV"
          echo "CI_SIMULATOR=$DEV" >> "$GITHUB_ENV"

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme TesseraUI

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme TesseraUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Tessera-Package \
            -destination "platform=iOS Simulator,name=${CI_SIMULATOR:-$SIMULATOR}" \
            -skipPackagePluginValidation

      - name: Public-API guard (ADR-007 freeze)
        run: ./scripts/check-public-api.sh
