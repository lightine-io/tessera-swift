name: CI

# Builds, tests, and API-guards the TesseraUI SwiftUI product. String Catalogs and SwiftUI do not compile
# under `swift build`, so everything runs through xcodebuild against an iOS Simulator (ADR-026 §4/§5).
#
# Not a required check in this repository: the "protect main" ruleset has no status-check rule. The
# main repository's release workflow does wait for this check on the Package.swift pin PR (since
# lightine-io/tessera#286; see its .claude/skills/release-gate/SKILL.md, gates 9 and 10).
#
# Every action is pinned to a full commit SHA with a version comment, as in the main repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apiguard:
    runs-on: macos-26
    env:
      # Xcode is pinned exactly, on the macos-26 image (which lists Xcode_26.4.1.app and an iOS 26.4
      # simulator runtime with iPhone 17; https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md).
      # The Kotlin Multiplatform compatibility table lists Xcode 26.4 for Kotlin 2.4.20-2.4.21
      # (https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html), and the
      # main repository builds the Tessera XCFramework with the same Xcode. The swift-api-digester baseline
      # is also Xcode-version sensitive: bump XCODE_VERSION and regenerate api/TesseraUI.baseline.json together.
      XCODE_VERSION: "26.4.1"
      SIMULATOR: "iPhone 17"
      SIMULATOR_OS: "26.4.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No real document data (MRZ guard)
        run: bash scripts/private-content-scan.sh --mrz-only

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XC="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XC" ]; then
            echo "::error::$XC is missing on this runner image; no fallback to another Xcode."
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check the iOS simulator exists
        run: |
          # The image ships the iOS 26.4.1 runtime (OS=26.4.1, not 26.4) with iPhone 17 for this Xcode; fail loudly if it does not
          # (no runtime download, no other device).
          # simctl names the runtime "iOS 26.4" while devices report OS 26.4.1, so search by major.minor.
          xcrun simctl list devices available "iOS ${SIMULATOR_OS%.*}" | grep -F "${SIMULATOR} ("

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme TesseraUI

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme TesseraUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme Tessera-Package \
            -destination "platform=iOS Simulator,name=${SIMULATOR},OS=${SIMULATOR_OS}" \
            -skipPackagePluginValidation

      - name: Public-API guard (ADR-007 freeze)
        run: ./scripts/check-public-api.sh
