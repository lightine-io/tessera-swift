name: old-ios

# Runs the package's tests on real iOS 15, 16, 17 and 18 simulators, plus a control leg on the image's own
# iOS (TES-343: the minimum went from iOS 18 to iOS 15). No old simulator runs on the maintainer's Mac
# (Xcode 27), so this is the only place the old-iOS code paths run. Not part of ci.yml: it downloads
# multi-GB runtimes and builds the framework.
#
# The package consumes a binary TesseraCore.xcframework. The `framework` job builds it from the chosen ref
# of lightine-io/tessera and the `test` job takes it through TESSERA_LOCAL_XCFRAMEWORK=1
# (.local-xcframework/), so a framework change is checked here before it is released. To check a released
# framework, give its tag as the ref. The ref must have the TesseraCore name (TES-346); a ref from 0.7.0 or
# earlier builds Tessera.xcframework and the framework job stops.
#
# What a leg proves (TES-372): the test bundle links the static framework as an app does, so a system
# symbol the old iOS lacks stops the bundle from loading (FrameworkLoadSmokeTests and the log summary show
# it); the saved-image reader runs Apple Vision on a drawn specimen (SavedImageVisionReadTests); the class
# walk sets up every class (ClassWalkTests). Chip reads with fake chips are not covered here: the fakes are
# Kotlin test code that the framework does not ship.
#
# Runs by hand and once a week (the main branch of lightine-io/tessera). Not a required check.
# Every action is pinned to a full commit SHA with a version comment.

on:
  workflow_dispatch:
    inputs:
      tessera_ref:
        description: "Branch, tag or SHA of lightine-io/tessera to build the XCFramework from"
        required: false
        default: main
      focus:
        description: "full: every test on every leg. permission: only ScannerModelPermissionTests, only on iOS 16.4, with a trace"
        required: false
        type: choice
        default: full
        options:
          - full
          - permission
  schedule:
    # Mondays 04:17 UTC. A scheduled run has no inputs, so it builds `main` with the `full` focus.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: old-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The framework is built with the Xcode the main repository pins (Kotlin 2.4.20-2.4.21 lists Xcode 26.4).
  FRAMEWORK_XCODE_VERSION: "26.4.1"
  # The input on manual runs; `main` on scheduled runs, which have no inputs.
  TESSERA_REF: ${{ inputs.tessera_ref || 'main' }}
  # `permission`: only the permission-watcher suite on iOS 16.4 (TES-343 diagnosis). `full`: everything.
  FOCUS: ${{ inputs.focus == 'permission' && 'permission' || 'full' }}

jobs:
  framework:
    name: XCFramework (${{ inputs.tessera_ref || 'main' }})
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lightine-io/tessera
          ref: ${{ env.TESSERA_REF }}
          persist-credentials: false

      - name: Select Xcode ${{ env.FRAMEWORK_XCODE_VERSION }}
        run: |
          XC="/Applications/Xcode_${FRAMEWORK_XCODE_VERSION}.app"
          if [ ! -d "$XC" ]; then
            echo "::error::$XC is missing on this runner image; no fallback to another Xcode."
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache the OpenSSL build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: emrtd-core/build/openssl
          key: openssl-${{ runner.os }}-xcode-${{ env.FRAMEWORK_XCODE_VERSION }}-${{ hashFiles('scripts/build-openssl-ios.sh') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # This workflow never writes the Gradle cache (it runs by hand and on a schedule).
          cache-read-only: true

      - name: Build the XCFramework
        run: ./gradlew :mrz-camera-ios:packTesseraCoreXCFramework

      - name: Zip the XCFramework (keeps symlinks)
        run: |
          BUILT="mrz-camera-ios/build/XCFrameworks/release/TesseraCore.xcframework"
          [ -d "$BUILT" ] || { echo "::error::$BUILT not found after the build."; exit 1; }
          mkdir -p "$RUNNER_TEMP/fw"
          # ditto keeps symlinks and extended attributes; upload-artifact would otherwise flatten them.
          ditto -c -k --sequesterRsrc --keepParent "$BUILT" "$RUNNER_TEMP/fw/TesseraCore.xcframework.zip"
          ls -l "$RUNNER_TEMP/fw"

      - name: Upload the XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tessera-xcframework
          path: ${{ runner.temp }}/fw/TesseraCore.xcframework.zip
          if-no-files-found: error
          retention-days: 7

  test:
    name: test · ${{ matrix.label }}
    needs: framework
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # `optional`: a leg whose runtime this runner's Xcode may not offer. If none of its versions installs, the
      # leg ends with a warning and runs no test, so the run stays green; if one installs, its tests count.
      # The `permission` focus keeps only the iOS 16.4 leg. (`env` is not readable here, hence the repeat.)
      matrix:
        include: ${{ fromJSON(inputs.focus == 'permission' && '[{"label":"iOS 16.4","ios":"16.4","device":"iPhone 14","xcode":"26.6","install":true,"optional":false}]' || '[{"label":"iOS 15","ios":"15.5 15.4 15.2 15.0","device":"iPhone 13","xcode":"26.6","install":true,"optional":true},{"label":"iOS 16.4","ios":"16.4","device":"iPhone 14","xcode":"26.6","install":true,"optional":false},{"label":"iOS 17.5","ios":"17.5","device":"iPhone 15","xcode":"26.6","install":true,"optional":false},{"label":"iOS 18","ios":"18.6 18.5 18.4","device":"iPhone 16","xcode":"26.6","install":true,"optional":false},{"label":"iOS 26.4.1 (control, on the image)","ios":"26.4.1","device":"iPhone 17","xcode":"26.4.1","install":false,"optional":false}]') }}
        # Xcode 26.4.1 crashes XCTest's start-up on iOS 15 simulators (Apple forum thread 822916,
        # "Tests fail to run on iOS 15 simulators", fixed in Xcode 26.5), so the old legs use the
        # newest Xcode on the image. The control leg uses the Xcode and runtime ci.yml uses.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          XC="/Applications/Xcode_${{ matrix.xcode }}.app"
          if [ ! -d "$XC" ]; then
            echo "::error::$XC is missing on this runner image; no fallback to another Xcode."
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Download the XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tessera-xcframework
          path: ${{ runner.temp }}/fw

      - name: Put the XCFramework in .local-xcframework
        run: |
          mkdir -p .local-xcframework
          ditto -x -k "$RUNNER_TEMP/fw/TesseraCore.xcframework.zip" .local-xcframework
          [ -d .local-xcframework/TesseraCore.xcframework ] || { echo "::error::The artifact did not hold TesseraCore.xcframework."; ls -la .local-xcframework; exit 1; }
          ls .local-xcframework/TesseraCore.xcframework

      - name: Simulator runtimes before
        run: xcrun simctl list runtimes

      # Apple documents `xcodebuild -downloadPlatform iOS -buildVersion <osversion> -architectureVariant <universal|arm64>`
      # (https://developer.apple.com/documentation/xcode/downloading-and-installing-additional-xcode-components).
      # Xcode 26.6 installs 16.4 and 17.5 this way (Apple forum thread 847134). Its answer for 15.5 was
      # "not available for download" (run 45470048797); Apple DTS says Xcode 26.2 offers iOS 15.0 and later
      # (forum thread 814284), so `ios` lists candidates, newest first, and the first one that installs is used.
      # Every answer is printed. If none installs, the step fails with all the answers.
      # iOS 18 (TES-372) lists the last 18.x releases, newest first, the same way: no run has yet shown
      # which of them Xcode 26.6 offers, so the first run's answers settle it.
      - name: Install an iOS ${{ matrix.ios }} simulator runtime
        id: rt
        if: matrix.install
        timeout-minutes: 60
        run: |
          set -uo pipefail
          has() {
            xcrun simctl list -j runtimes | python3 -I -c 'import json,sys; v=sys.argv[1]; sys.exit(0 if any(r.get("version")==v and "iOS" in r.get("name","") and r.get("isAvailable") for r in json.load(sys.stdin)["runtimes"]) else 1)' "$1"
          }
          ANSWERS=""
          for v in ${{ matrix.ios }}; do
            if has "$v"; then echo "iOS $v is already installed."; echo "version=$v" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          for v in ${{ matrix.ios }}; do
            for variant in universal default arm64; do
              echo "::group::downloadPlatform iOS $v ($variant)"
              if [ "$variant" = default ]; then ARGS=(); else ARGS=(-architectureVariant "$variant"); fi
              RC=0; OUT=$(xcodebuild -downloadPlatform iOS -buildVersion "$v" ${ARGS[@]+"${ARGS[@]}"} 2>&1) || RC=$?  # the step runs with bash -e: a refused variant must not end it
              echo "$OUT"
              echo "::endgroup::"
              ANSWERS="$ANSWERS"$'\n'"iOS $v ($variant): rc=$RC: $(echo "$OUT" | tail -n 1)"
              if [ "$RC" = 0 ] && has "$v"; then echo "version=$v" >> "$GITHUB_OUTPUT"; exit 0; fi
            done
          done
          echo "::group::What the runner has"
          xcrun simctl runtime list || true
          xcrun simctl list runtimes || true
          xcodebuild -showsdks || true
          echo "::endgroup::"
          if [ "${{ matrix.optional }}" = true ]; then
            # Run 45492838701: every iOS 15 version and variant answered "not available for download".
            echo "::warning title=No iOS ${{ matrix.label }} runtime on this runner::No version of ${{ matrix.ios }} is available for download to this Xcode on this runner, so no test ran on ${{ matrix.label }}. Answers:$ANSWERS"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No iOS ${{ matrix.ios }} runtime could be installed. Answers:$ANSWERS"
          exit 1

      - name: Use the installed runtime
        if: steps.rt.outputs.skip != 'true'
        id: ver
        run: |
          if [ -n "${{ steps.rt.outputs.version }}" ]; then V="${{ steps.rt.outputs.version }}"; else V="${{ matrix.ios }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Testing on iOS $V"

      - name: Simulator runtimes after
        if: steps.rt.outputs.skip != 'true'
        run: xcrun simctl list runtimes

      - name: Create and boot the simulator
        if: steps.rt.outputs.skip != 'true'
        id: sim
        run: |
          set -euo pipefail
          python3 -I - <<'PY' > "$RUNNER_TEMP/sim.env"
          import json, subprocess, sys
          ios = "${{ steps.ver.outputs.version }}"
          device = "${{ matrix.device }}"
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "runtimes"]))["runtimes"]
          match = [r for r in runtimes if r.get("version") == ios and r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not match:
              print("::error::No available iOS runtime with version exactly %s. Found: %s" % (ios, [(r["name"], r.get("version")) for r in runtimes]), file=sys.stderr)
              sys.exit(1)
          rt = match[0]
          types = {t["name"]: t["identifier"] for t in rt.get("supportedDeviceTypes", [])}
          if device not in types:
              print("::error::%s is not a device type of %s. It has: %s" % (device, rt["name"], sorted(types)), file=sys.stderr)
              sys.exit(1)
          print("RUNTIME=%s" % rt["identifier"])
          print("DEVICE_TYPE=%s" % types[device])
          PY
          cat "$RUNNER_TEMP/sim.env"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/sim.env"
          UDID=$(xcrun simctl create "old-ios-${{ steps.ver.outputs.version }}" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -F "$UDID"

      - name: Test (iOS ${{ steps.ver.outputs.version }})
        if: steps.rt.outputs.skip != 'true'
        timeout-minutes: 60
        env:
          TESSERA_LOCAL_XCFRAMEWORK: "1"
          UDID: ${{ steps.sim.outputs.udid }}
          # xcodebuild hands TEST_RUNNER_<name> to the test process as <name>. The permission tests then print
          # `permission-trace` lines: status reads, camera starts, how long each 10 ms wait sleep really took,
          # and each wait's outcome. Test names, status codes, counts and times only.
          TEST_RUNNER_TESSERA_PERMISSION_TRACE: "1"
        run: |
          set -o pipefail
          # Crash reports newer than this mark belong to this run (see the summary step).
          touch "$RUNNER_TEMP/test-start"
          ONLY=()
          if [ "$FOCUS" = permission ]; then
            ONLY=(-only-testing:TesseraUITests/ScannerModelPermissionTests)
            echo "Focus: permission - only ScannerModelPermissionTests"
          fi
          xcodebuild test \
            -scheme Tessera-Package \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -resultBundlePath "$RUNNER_TEMP/result-${{ matrix.label }}.xcresult" \
            ${ONLY[@]+"${ONLY[@]}"} \
            -skipPackagePluginValidation 2>&1 | tee "$RUNNER_TEMP/test-${{ matrix.label }}.log"

      - name: Permission trace (iOS ${{ steps.ver.outputs.version }})
        if: always() && steps.rt.outputs.skip != 'true'
        run: |
          LOG="$RUNNER_TEMP/test-${{ matrix.label }}.log"
          [ -f "$LOG" ] || { echo "No test log."; exit 0; }
          grep -E 'permission-trace|ScannerModelPermissionTests|Test run with' "$LOG" || echo "No permission-trace lines."

      # TES-372: the reason for a failure goes to the job log, so it can be read even when an upload fails.
      # Prints the result line, the test counts, each failing test with its message, and every line that
      # says the test process could not load or crashed. Always ends green: the Test step carries the result.
      - name: Failure summary (iOS ${{ steps.ver.outputs.version }})
        if: always() && steps.rt.outputs.skip != 'true'
        env:
          LOG: ${{ runner.temp }}/test-${{ matrix.label }}.log
          BUNDLE: ${{ runner.temp }}/result-${{ matrix.label }}.xcresult
        run: |
          set +e
          LOAD='dyld\[|dyld:|Symbol not found|Library not loaded|unexpected exit|crashed|Terminating app|couldn.t be loaded|failed to load|exited before'
          # Prints the matching lines of stdin, or "None." when there are none.
          lines() { OUT=$(grep -iE "$1" | head -n "$2"); if [ -n "$OUT" ]; then echo "$OUT"; else echo "None."; fi; }
          echo "::group::Result and counts (console log)"
          if [ -f "$LOG" ]; then
            grep -E '\*\* TEST (SUCCEEDED|FAILED) \*\*|Testing failed:|Executed [0-9]+ tests?|Test run with [0-9]+ tests?|Test Suite .* (passed|failed) at' "$LOG" | tail -n 40
          else
            echo "No test log."
          fi
          echo "::endgroup::"
          if [ -f "$LOG" ]; then
            echo "Failing tests and their messages (console log):"
            # Swift Testing marks a failed test or issue with "✘"; XCTest writes "error: -[Suite test] : message";
            # xcodebuild lists "Failing tests:" at the end.
            grep -E '✘|: error: |error: -\[|^Failing tests:|^\s+[A-Za-z0-9_]+\.[A-Za-z0-9_]+\(\)$|^\s+-\[' "$LOG" | head -n 200
            echo "Load and crash lines (console log):"
            lines "$LOAD" 60 < "$LOG"
          fi
          if [ -d "$BUNDLE" ]; then
            echo "Failing tests and their messages (result bundle):"
            xcrun xcresulttool get test-results summary --path "$BUNDLE" --compact > "$RUNNER_TEMP/summary.json" 2> "$RUNNER_TEMP/summary.err"
            python3 -I - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except Exception as e:
              print("No readable summary: %s" % e)
              sys.exit(0)
          print("result=%s total=%s passed=%s failed=%s skipped=%s" % (
              s.get("result"), s.get("totalTestCount"), s.get("passedTests"), s.get("failedTests"), s.get("skippedTests")))
          for f in s.get("testFailures", [])[:50]:
              print("FAILED %s / %s: %s" % (f.get("targetName", "?"), f.get("testIdentifierString") or f.get("testName"), (f.get("failureText") or "").strip()[:600]))
          PY
            cat "$RUNNER_TEMP/summary.err"
            echo "Load and crash lines (result bundle log):"
            xcrun xcresulttool get log --path "$BUNDLE" --type action 2>&1 | lines "$LOAD" 60
          fi
          echo "Crash reports written during the test:"
          if [ -f "$RUNNER_TEMP/test-start" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -type f -newer "$RUNNER_TEMP/test-start" 2>/dev/null | while read -r f; do
              echo "--- $(basename "$f")"
              grep -iE 'Symbol not found|Library not loaded|"termination"|exception|dyld|"procName"|"osVersion"' "$f" | head -n 20
            done
          fi
          exit 0

      # Two uploads: the console log is small and goes first; the result bundle is large and once timed out.
      # Neither may change the job's result, which is the Test step's.
      - name: Upload the log
        if: failure() && steps.rt.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: old-ios-${{ matrix.label }}-log
          path: ${{ runner.temp }}/test-${{ matrix.label }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the result bundle
        if: failure() && steps.rt.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: old-ios-${{ matrix.label }}-result
          path: ${{ runner.temp }}/result-${{ matrix.label }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
